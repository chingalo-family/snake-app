name: Feature request
description: Suggest an enhancement for Snake App
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check docs/IMPLEMENTATION_PLAN.md and existing issues before requesting something already planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing for players or contributors today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Mention screens or platforms if you know them (home, levels, game, profile, settings, …).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, or why an existing setting is not enough.
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms this matters most on
      multiple: true
      options:
        - Android
        - iOS
        - Linux
        - macOS
        - Windows
        - Web
        - All / not sure
