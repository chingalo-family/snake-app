name: snake_app
description: "Snake App — an engaging, addictive snake game by Chingalo Family."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app-icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0B1F1A"
  adaptive_icon_foreground: assets/app-icon.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/app-icon.png
    background_color: "#0B1F1A"
    theme_color: "#1FA87A"
  windows:
    generate: true
    image_path: assets/app-icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/app-icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/app-icon.png
