name: snake_app
description: "Snake App — an engaging, addictive snake game by Chingalo Family."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  shared_preferences: ^2.5.3
  drift: ^2.28.0
  sqlite3: ^2.7.5
  sqlite3_flutter_libs: ^0.5.32
  path: ^1.9.1
  path_provider: ^2.1.5
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1
  audioplayers: ^6.8.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.15
  drift_dev: ^2.28.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app-icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0B1F1A"
  adaptive_icon_foreground: assets/app-icon.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/app-icon.png
    background_color: "#0B1F1A"
    theme_color: "#1FA87A"
  windows:
    generate: true
    image_path: assets/app-icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/app-icon.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/app-icon.png
    # Drop BGM/SFX files into this folder (see assets/audio/README.md).
    - assets/audio/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
