name: snake_app
description: "A simple snake game built with Flutter."
publish_to: 'none' 
version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  syncfusion_flutter_pdfviewer: ^31.1.23
  mailer: ^6.5.0
  flutter_svg: ^2.2.1
  sqflite: ^2.4.2
  http: ^1.5.0
  shared_preferences: ^2.5.3
  provider: ^6.1.5+1
  dhis2_dart_utils: ^1.1.26
  fluttertoast: ^9.0.0
  path: ^1.9.1
  audioplayers: ^6.5.1
  haptic_feedback: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/icons/
    - assets/sounds/
